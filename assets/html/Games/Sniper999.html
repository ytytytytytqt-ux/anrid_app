<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>تک‌تیرانداز مطالعات — ULTRA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0}
  canvas{display:block}
  #grain{position:fixed;inset:-50%;pointer-events:none;z-index:6;opacity:.09;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    animation: grain 0.4s steps(4) infinite;mix-blend-mode:overlay;}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-8%,4%)}50%{transform:translate(4%,-6%)}
    75%{transform:translate(-4%,-3%)}100%{transform:translate(6%,5%)}}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:7;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.35) 75%, rgba(0,0,0,.85) 100%);}
  #chroma{position:fixed;inset:0;pointer-events:none;z-index:8;
    background: radial-gradient(circle at center, transparent 55%, rgba(255,0,60,.05) 80%, rgba(0,120,255,.07) 100%);
    mix-blend-mode:screen;}
  #scanlines{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.055;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0px, rgba(255,255,255,.5) 1px, transparent 1px, transparent 3px);}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #topBar{position:absolute;top:0;left:0;right:0;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0 12px;
    display:flex;flex-direction:column;gap:8px;
    transition: opacity .32s ease, transform .32s ease;}
  #topBar.hidden{opacity:0;transform:translateY(-18px);pointer-events:none;}
  #topRow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #questionBox{position:relative;flex:1;min-width:0;
    background: linear-gradient(135deg, rgba(0,20,45,.95), rgba(0,55,100,.88));
    border-radius:14px;padding: 10px 16px; color:#fff;
    font-size: clamp(13px, 3.8vw, 17px); font-weight:900;
    text-shadow: 0 0 14px rgba(0,229,255,.95), 0 2px 4px rgba(0,0,0,.9);
    letter-spacing:0.5px; line-height:1.45;
    box-shadow:0 0 26px rgba(0,229,255,.5),0 0 65px rgba(0,150,255,.3),
      inset 0 0 22px rgba(0,229,255,.15),0 4px 14px rgba(0,0,0,.75);
    animation: qPulse 2.4s ease-in-out infinite;overflow:hidden;
    white-space:normal;word-break:break-word;}
  #questionBox::before{content:'';position:absolute;inset:-3px;border-radius:16px;
    background: conic-gradient(from 0deg, #00e5ff, #0066ff, #b300ff, #00e5ff);
    z-index:-1;filter:blur(8px);opacity:.8;animation: rotate 4s linear infinite;}
  @keyframes rotate{to{transform:rotate(360deg)}}
  #questionBox::after{content:'';position:absolute;inset:0;border-radius:14px;
    border:1.5px solid rgba(0,229,255,.85);box-shadow: inset 0 0 18px rgba(0,229,255,.45);
    pointer-events:none;}
  @keyframes qPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
  #coinBox{position:relative;display:flex;align-items:center;gap:8px;
    background: linear-gradient(135deg, rgba(55,35,0,.97), rgba(130,88,0,.9));
    border-radius:14px;padding: 8px 14px 8px 10px;
    color:#ffe082;font-size: clamp(15px, 4.2vw, 20px); font-weight:900;
    text-shadow: 0 0 14px rgba(255,193,7,1), 0 2px 4px rgba(0,0,0,.9);
    box-shadow:0 0 22px rgba(255,193,7,.5),0 0 55px rgba(255,140,0,.3),
      inset 0 0 14px rgba(255,193,7,.2),0 4px 12px rgba(0,0,0,.75);
    transition: transform .15s;flex-shrink:0;}
  #coinBox::before{content:'';position:absolute;inset:-2px;border-radius:16px;
    background: conic-gradient(from 0deg, #ffd54f, #ff8f00, #ffd54f);
    z-index:-1;filter:blur(6px);opacity:.85;animation: rotate 3s linear infinite reverse;}
  #coinBox::after{content:'';position:absolute;inset:0;border-radius:14px;
    border:1.5px solid rgba(255,193,7,.85);pointer-events:none;}
  #coinBox.pop{transform:scale(1.22) rotate(-2deg);filter:brightness(1.5)}
  .coinIcon{width:22px;height:22px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fffde7, #ffd54f 45%, #ff8f00 95%);
    box-shadow: 0 0 14px #ffc107, 0 0 26px rgba(255,193,7,.7), inset 0 -2px 5px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,255,255,.8);
    border:1.5px solid #ffb300;flex-shrink:0;position:relative;}
  .coinIcon::after{content:'$';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;color:#8d4a00;font-family:Arial;}

  #multBadge{position:absolute;top:calc(16px + env(safe-area-inset-top));left:50%;
    transform: translate(-50%, -14px) scale(.94);
    padding:10px 22px;border-radius:14px;
    background: linear-gradient(135deg, rgba(40,20,0,.94), rgba(100,60,0,.9));
    border:1.5px solid rgba(255,193,7,.85);color:#ffd54f;
    font-size:clamp(16px, 4.4vw, 22px);font-weight:900;
    letter-spacing:.5px;
    text-shadow: 0 0 12px rgba(255,193,7,1), 0 1px 2px #000;
    box-shadow: 0 0 22px rgba(255,193,7,.65), 0 0 45px rgba(255,140,0,.35),
      inset 0 0 14px rgba(255,193,7,.2);
    opacity:0;transition: opacity .32s ease-out, transform .32s cubic-bezier(.2,1.2,.4,1);
    pointer-events:none;z-index:11;}
  #multBadge.show{opacity:1; transform: translate(-50%, 0) scale(1);}

  #optionsGrid{display:grid;grid-template-columns: 1fr 1fr;gap:6px;padding:0 2px;}
  .opt{position:relative;display:flex;align-items:center;gap:6px;
    background: linear-gradient(135deg, rgba(0,18,38,.92), rgba(0,40,75,.85));
    border-radius:11px;padding:8px 10px;color:#e8f6ff;
    font-size: clamp(11px, 3.2vw, 13.5px); font-weight:800;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
    box-shadow:0 0 14px rgba(0,180,255,.25),inset 0 0 10px rgba(0,229,255,.08),
      0 2px 6px rgba(0,0,0,.6);
    border:1px solid rgba(0,229,255,.4);transition: all .25s;
    white-space:normal;word-break:break-word;overflow:visible;}
  .opt::before{content:'';position:absolute;inset:0;border-radius:11px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,.15), transparent);pointer-events:none;}
  .opt-num{display:flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;border-radius:50%;
    background: linear-gradient(135deg, #00e5ff, #0066cc);
    color:#fff;font-weight:900;font-size:12px;
    box-shadow: 0 0 10px #00e5ff, inset 0 0 6px rgba(255,255,255,.4);
    text-shadow: 0 1px 2px rgba(0,0,0,.6);flex-shrink:0;}
  .opt-emoji{font-size: clamp(14px, 3.8vw, 17px);line-height:1;filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));}
  .opt-text{white-space:normal;word-break:break-word;font-weight:800;line-height:1.3;}
  .opt.mark-wrong,.opt.mark-right{ overflow:visible; }
  .opt.mark-wrong{border-color: rgba(255,70,70,.95);
    background: linear-gradient(135deg, rgba(60,0,12,.95), rgba(120,10,25,.88));
    box-shadow: 0 0 22px rgba(255,40,40,.75), inset 0 0 14px rgba(255,60,60,.22), 0 2px 8px rgba(0,0,0,.7);
    animation: markShake .5s ease-out both, wrongPulse 1.1s ease-in-out .5s infinite;}
  .opt.mark-wrong::after{content:'✗';position:absolute;top:-9px;left:-9px;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;color:#fff;line-height:1;
    background: radial-gradient(circle at 34% 28%, #ff9a9a, #e00000 55%, #6d0000 100%);
    border:1.5px solid rgba(255,210,210,.85);
    box-shadow: 0 0 16px #ff2a2a, 0 0 30px rgba(255,0,0,.7), inset 0 -2px 5px rgba(0,0,0,.5);
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    animation: badgePop .45s cubic-bezier(.2,1.7,.4,1) both;z-index:6;}
  .opt.mark-right{border-color: rgba(60,255,140,.95);
    background: linear-gradient(135deg, rgba(0,45,20,.95), rgba(0,110,50,.88));
    box-shadow: 0 0 22px rgba(40,255,120,.7), inset 0 0 14px rgba(60,255,140,.2), 0 2px 8px rgba(0,0,0,.7);
    animation: markShake .5s ease-out both, rightPulse 1.1s ease-in-out .5s infinite;}
  .opt.mark-right::after{content:'✓';position:absolute;top:-9px;left:-9px;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;color:#fff;line-height:1;
    background: radial-gradient(circle at 34% 28%, #b6ffcf, #00c853 55%, #005c22 100%);
    border:1.5px solid rgba(210,255,225,.85);
    box-shadow: 0 0 16px #00e676, 0 0 30px rgba(0,200,80,.7), inset 0 -2px 5px rgba(0,0,0,.5);
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    animation: badgePop .45s cubic-bezier(.2,1.7,.4,1) both .12s;z-index:6;}
  @keyframes badgePop{0%{transform:scale(0) rotate(-140deg);opacity:0}
    70%{transform:scale(1.25) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes markShake{0%{transform:translateX(0)}18%{transform:translateX(-7px)}
    36%{transform:translateX(6px)}54%{transform:translateX(-4px)}
    72%{transform:translateX(3px)}100%{transform:translateX(0)}}
  @keyframes wrongPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
  @keyframes rightPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
  #comboBox{position:absolute;top:calc(130px + env(safe-area-inset-top));right:14px;
    display:none !important;align-items:center;gap:6px;padding:5px 12px;border-radius:11px;
    background: linear-gradient(135deg, rgba(120,0,20,.9), rgba(200,20,0,.85));
    border:1.5px solid rgba(255,80,80,.9);
    color:#fff;font-weight:900;font-size:15px;
    text-shadow: 0 0 12px #ff3030, 0 2px 4px #000;
    box-shadow: 0 0 22px rgba(255,40,40,.7), inset 0 0 14px rgba(255,80,80,.3);
    animation: comboPop .3s ease-out;z-index:12;}
  #comboBox.show{display:none !important}
  #comboBox .fire{font-size:18px;filter:drop-shadow(0 0 6px #ff8c00)}
  @keyframes comboPop{0%{transform:scale(.5) rotate(-10deg);opacity:0}
    70%{transform:scale(1.15) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  #hipCross{position:absolute;top:50%;left:50%;width:40px;height:40px;
    transform:translate(-50%,-50%);opacity:.85;transition:opacity .2s;
    filter: drop-shadow(0 0 4px rgba(0,229,255,1));}
  #hipCross.hide{opacity:0}
  #hipCross i{position:absolute;background:#fff;box-shadow:0 0 5px #000, 0 0 3px #00e5ff}
  #hipCross i:nth-child(1){left:50%;top:0;width:2px;height:13px;transform:translateX(-50%)}
  #hipCross i:nth-child(2){left:50%;bottom:0;width:2px;height:13px;transform:translateX(-50%)}
  #hipCross i:nth-child(3){top:50%;left:0;height:2px;width:13px;transform:translateY(-50%)}
  #hipCross i:nth-child(4){top:50%;right:0;height:2px;width:13px;transform:translateY(-50%)}
  #hipCross i:nth-child(5){top:50%;left:50%;width:4px;height:4px;border-radius:50%;
    transform:translate(-50%,-50%);background:#00e5ff;box-shadow:0 0 9px #00e5ff, 0 0 15px #00e5ff;}
  #joystick{position:absolute;left: 22px;bottom: calc(30px + env(safe-area-inset-bottom));
    width: 145px; height: 145px;pointer-events:auto;touch-action:none;z-index:15;}
  #joystick .joy-base{position:absolute;inset:0;border-radius:50%;
    background: radial-gradient(circle at 50% 50%, rgba(0,229,255,.10) 0%, rgba(0,40,80,.25) 70%, rgba(0,20,45,.35) 100%);
    border: 2px solid rgba(0,229,255,.7);
    box-shadow:0 0 25px rgba(0,229,255,.55),0 0 55px rgba(0,150,255,.35),
      inset 0 0 25px rgba(0,229,255,.18),inset 0 0 60px rgba(0,80,160,.25);
    backdrop-filter: blur(4px);-webkit-backdrop-filter: blur(4px);}
  #joystick .joy-base::before{content:'';position:absolute;inset:10px;border-radius:50%;
    border:1px dashed rgba(0,229,255,.35);}
  #joystick .joy-base::after{content:'';position:absolute;inset:0;border-radius:50%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(0,229,255,.15) 25%, transparent 50%, rgba(0,150,255,.15) 75%, transparent 100%);
    animation: rotate 8s linear infinite;}
  #joystick .joy-handle{position:absolute;top:50%;left:50%;
    width:66px;height:66px;border-radius:50%;transform: translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #b0f0ff 25%, #29b6f6 60%, #0277bd 95%);
    border: 2.5px solid rgba(220,245,255,.95);
    box-shadow:0 0 22px rgba(0,229,255,.9),0 0 45px rgba(0,150,255,.55),
      0 6px 14px rgba(0,0,0,.6),inset 0 -5px 12px rgba(0,0,0,.35),
      inset 0 5px 10px rgba(255,255,255,.95);
    transition: transform .14s cubic-bezier(.2,1,.4,1);pointer-events:none;}
  #joystick .joy-handle.active{ transition: none; }
  #joyLabel{position:absolute;left: 22px;bottom: calc(10px + env(safe-area-inset-bottom));
    width: 145px;text-align:center;color: rgba(150,225,255,.9);
    font-size: 13px;font-weight: 900;letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0,229,255,.9), 0 2px 4px #000;
    pointer-events:none;z-index:14;font-family: Tahoma, Arial;}
  #fireBtn{position:absolute;left: 230px;bottom: calc(38px + env(safe-area-inset-bottom));
    width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #ffb0a0 0%, #e63a24 30%, #8a0d00 68%, #3a0300 100%);
    border:3px solid rgba(255,220,200,.45);
    box-shadow:0 0 40px rgba(255,60,20,.85),0 0 90px rgba(255,30,0,.45),
      0 12px 28px rgba(0,0,0,.9),inset 0 -10px 22px rgba(0,0,0,.7),
      inset 0 8px 16px rgba(255,220,200,.4),inset 0 0 0 2px rgba(0,0,0,.5);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    transition:transform .08s ease,box-shadow .15s;touch-action:none;overflow:visible;z-index:15;}
  #fireBtn::before{content:'';position:absolute;inset:-12px;border-radius:50%;
    border:2px solid rgba(255,90,50,.65);animation: ringPulse 1.9s ease-out infinite;}
  #fireBtn::after{content:'';position:absolute;inset:-22px;border-radius:50%;
    border:1.5px solid rgba(255,60,30,.35);animation: ringPulse 1.9s ease-out infinite .55s;}
  @keyframes ringPulse{0%{transform:scale(.82);opacity:1}100%{transform:scale(1.4);opacity:0}}
  #fireBtn.pressed{transform:scale(.88);
    box-shadow:0 0 90px rgba(255,70,10,1),0 0 160px rgba(255,30,0,.7),
      0 4px 14px rgba(0,0,0,.95),inset 0 -4px 14px rgba(0,0,0,.7),
      inset 0 4px 14px rgba(255,255,255,.5),inset 0 0 0 2px rgba(0,0,0,.5);}
  #fireBtn .core{position:absolute;inset:14px;border-radius:50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,240,220,.35), transparent 65%);pointer-events:none;}
  #fireBtn .inner-ring{position:absolute;inset:10px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.4);
    box-shadow: inset 0 0 12px rgba(0,0,0,.5), 0 0 8px rgba(255,200,150,.3);}
  #fireBtn svg{width:56px;height:56px;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,.95)) drop-shadow(0 0 5px rgba(255,255,255,.5));
    position:relative;z-index:2;}
  #scope{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .18s ease-out}
  #scope.active{opacity:1}
  .scope-mask{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88vmin;height:88vmin;border-radius:50%;
    box-shadow:0 0 0 200vmax rgba(0,0,0,.995),inset 0 0 110px rgba(0,0,0,.98),
      inset 0 0 0 2px rgba(0,0,0,.95),inset 0 0 0 10px rgba(10,10,15,.98),
      inset 0 0 0 13px rgba(0,0,0,.92),0 0 50px rgba(0,0,0,1);}
  .scope-glass{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88vmin;height:88vmin;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 50% 47%, rgba(90,170,230,.13) 0%, rgba(0,0,0,0) 55%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.04) 0%, rgba(0,0,0,.2) 92%);}
  .scope-chroma{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88vmin;height:88vmin;border-radius:50%;
    box-shadow:inset 0 0 0 3px rgba(255,60,60,.25),inset 0 0 0 6px rgba(60,180,255,.22),
      inset 0 0 50px rgba(0,0,0,.5);}
  .reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88vmin;height:88vmin}
  .reticle .ln{position:absolute;background:#080808;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.24), 0 0 8px rgba(0,0,0,.98);}
  .r-vt{left:50%;top:0;width:2px;height:calc(50% - 15px);transform:translateX(-50%)}
  .r-vb{left:50%;bottom:0;width:2px;height:calc(50% - 15px);transform:translateX(-50%)}
  .r-hl{top:50%;left:0;height:2px;width:calc(50% - 15px);transform:translateY(-50%)}
  .r-hr{top:50%;right:0;height:2px;width:calc(50% - 15px);transform:translateY(-50%)}
  .r-dot{top:50%;left:50%;width:9px;height:9px;border-radius:50%;
    background:#000;transform:translate(-50%,-50%);
    box-shadow: 0 0 0 1px rgba(255,60,60,.75), 0 0 9px rgba(0,0,0,1);}
  .r-dot::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:50%;
    background:#ff2a2a;transform:translate(-50%,-50%);
    box-shadow: 0 0 8px #ff2a2a, 0 0 14px #ff2a2a;
    animation: redDotPulse 1s ease-in-out infinite;}
  @keyframes redDotPulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    50%{opacity:.7;transform:translate(-50%,-50%) scale(.85)}}
  .r-thick{position:absolute;background:#080808;box-shadow:0 0 0 .5px rgba(255,255,255,.18)}
  .t1{left:50%;top:calc(50% + 24px);width:2px;height:16px;transform:translateX(-50%)}
  .t2{left:50%;top:calc(50% + 56px);width:2px;height:16px;transform:translateX(-50%)}
  .t3{left:50%;top:calc(50% + 96px);width:2px;height:16px;transform:translateX(-50%)}
  .t4{left:50%;bottom:calc(50% + 24px);width:2px;height:16px;transform:translateX(-50%)}
  .t5{left:calc(50% + 24px);top:50%;height:2px;width:16px;transform:translateY(-50%)}
  .t6{left:calc(50% + 56px);top:50%;height:2px;width:16px;transform:translateY(-50%)}
  .t7{left:calc(50% + 96px);top:50%;height:2px;width:16px;transform:translateY(-50%)}
  .t8{right:calc(50% + 24px);top:50%;height:2px;width:16px;transform:translateY(-50%)}
  .t9{right:calc(50% + 56px);top:50%;height:2px;width:16px;transform:translateY(-50%)}
  .scope-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88vmin;height:88vmin;border-radius:50%;
    border:2px solid rgba(0,0,0,.9);
    box-shadow: inset 0 0 60px rgba(0,0,0,.8), inset 0 0 10px rgba(255,255,255,.1);}
  .scope-label{position:absolute;top:50%;left:50%;width:88vmin;height:88vmin;transform:translate(-50%,-50%);
    font-family: Consolas,'Courier New',monospace;font-size:11px;color:rgba(180,230,255,.7);
    letter-spacing:1.2px;text-shadow: 0 0 5px rgba(0,180,255,.7), 0 0 12px rgba(0,180,255,.4);}
  .scope-label span{position:absolute}
  .lbl-t{top:7%;left:50%;transform:translateX(-50%)}
  .lbl-b{bottom:7%;left:50%;transform:translateX(-50%)}
  .lbl-l{left:7%;top:50%;transform:translateY(-50%)}
  .lbl-r{right:7%;top:50%;transform:translateY(-50%)}
  .scope-label .warn{color:#ff4040;font-weight:bold;
    text-shadow: 0 0 6px #ff0000, 0 0 14px #ff0000;
    animation: warnBlink 1.4s ease-in-out infinite;}
  @keyframes warnBlink{0%,100%{opacity:1}50%{opacity:.35}}
  .scope-tip{position:absolute;bottom:calc(50% + 44vmin + 16px);left:50%;
    transform:translateX(-50%) scale(.68);transform-origin:bottom center;
    width:min(62vmin, 300px);text-align:center;padding:10px 18px;border-radius:20px;
    font-size: clamp(12px, 3.5vw, 16px);font-weight:900;line-height:1.75;color:#eafaff;
    background: linear-gradient(135deg, rgba(0,30,60,.88), rgba(0,70,120,.72));
    border:1.5px solid rgba(0,229,255,.75);
    box-shadow:0 0 26px rgba(0,229,255,.6),inset 0 0 16px rgba(0,229,255,.18),0 6px 18px rgba(0,0,0,.8);

function fixHalfSpace(obj) {
  if (typeof obj === 'string') {
    let s = obj.replace(/[\u200C\u200D\u200E\u200F\uFEFF\u200B]/g, ' ');
    s = s.replace(/زمینگرمایی/g, 'زمین گرمایی');
    s = s.replace(/زغالسنگ/g, 'زغال سنگ');
    s = s.replace(/تجدیدناپذیر/g, 'تجدید ناپذیر');
    s = s.replace(/تجدیدپذیر/g, 'تجدید پذیر');
    s = s.replace(/سوختهای/g, 'سوخت های');
    s = s.replace(/یاختههای/g, 'یاخته های');
    s = s.replace(/شدهاند/g, 'شده اند');
    s = s.replace(/میباشند/g, 'می باشند');
    s = s.replace(/میشوند/g, 'می شوند');
    s = s.replace(/میشود/g, 'می شود');
    s = s.replace(/  +/g, ' ');
    return s.trim();
  }
  if (Array.isArray(obj)) {
    return obj.map(fixHalfSpace);
  }
  if (obj && typeof obj === 'object' && obj !== null) {
    const res = {};
    for (let key in obj) {
      res[key] = fixHalfSpace(obj[key]);
    }
    return res;
  }
  return obj;
}

let studyQuestions = [];
window.setGameQuestions = function(qList) {
  if (qList && qList.length > 0) {
    studyQuestions = fixHalfSpace(qList);

};

function toFa(n){ return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

function terrainHeight(x, z){
  let h = 0;
  h += Math.sin(x * 0.055 + 1.3) * Math.cos(z * 0.062 - 0.7) * 2.1;
  h += Math.sin(x * 0.12 + z * 0.09 + 2.1) * 1.1;
  h += Math.cos(x * 0.035 - z * 0.045 - 1.5) * 2.4;
  h += Math.sin(x * 0.21 + z * 0.17) * 0.55;

  const pd = Math.sqrt(x*x + (z-START_Z)*(z-START_Z));
  const playerRidge = Math.max(0, 1 - pd / 18);
  h += playerRidge * 5;

  const enemyCenterZ = -30;
  const edx = x * 0.65;
  const edz = z - enemyCenterZ;
  const ed = Math.sqrt(edx*edx + edz*edz);
  const enemyPlateau = Math.max(0, 1 - ed / 32);
  h += enemyPlateau * 3.5;

  return h;
}

function getPlayerProgress(){
  return Math.max(0, START_Z - playerZ);
}

/* ضریب سکه فقط یکی از این مقادیر مجاز است: 1.0 / 1.1 / 1.2 / 1.3 / 1.4 / 1.5

   - مقدار پایه ۱.۰ هنگام شروع حرکت نشان داده می‌شود */
const MULT_STEPS = [1.0, 1.1, 1.2, 1.3, 1.4, 1.5];
function getCoinMultiplier(){
  const p = getPlayerProgress();
  const step = Math.min(MULT_STEPS.length - 1, Math.floor(p / 20));
  return MULT_STEPS[step];
}
function formatMult(m){
  return toFa(m.toFixed(1));
}

/* ---------- Audio ---------- */
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playShotSound(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * 0.4);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.5);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(4800, t);
  filt.frequency.exponentialRampToValueAtTime(140, t + 0.34);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.6, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(t);

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(130, t);
  osc.frequency.exponentialRampToValueAtTime(36, t + 0.22);
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.55, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  osc.connect(g2).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.3);
}

function playHeadshotSound(){
  try {
    if (typeof window.HEADSHOT_AUDIO_B64 !== 'undefined' && window.HEADSHOT_AUDIO_B64) {
      const audio = new Audio(window.HEADSHOT_AUDIO_B64);
      audio.volume = 1.0;
      audio.play().catch(e => {});
      return;
    }
  } catch(e) {}

  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  [880, 1320, 1760, 2200].forEach((f,i)=>{
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f, t + i*0.05);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t + i*0.05);
    g.gain.exponentialRampToValueAtTime(0.3, t + i*0.05 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.05 + 0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i*0.05); o.stop(t + i*0.05 + 0.32);
  });
}

function playCoinSound(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  [1046, 1568, 2093].forEach((f,i)=>{
    const o = audioCtx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(f, t + i*0.06);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t + i*0.06);
    g.gain.exponentialRampToValueAtTime(0.13, t + i*0.06 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.06 + 0.16);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i*0.06); o.stop(t + i*0.06 + 0.2);
  });
}

function playThunderSound(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * 1.5);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.8);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(400, t);
  filt.frequency.exponentialRampToValueAtTime(80, t + 1.4);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(t);
}

function playRevealSound(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const o1 = audioCtx.createOscillator();
  o1.type = 'sawtooth';
  o1.frequency.setValueAtTime(210, t);
  o1.frequency.exponentialRampToValueAtTime(62, t + 0.30);
  const f1 = audioCtx.createBiquadFilter();
  f1.type = 'lowpass';
  f1.frequency.setValueAtTime(1600, t);
  f1.frequency.exponentialRampToValueAtTime(320, t + 0.32);
  const g1 = audioCtx.createGain();
  g1.gain.setValueAtTime(0.0001, t);
  g1.gain.exponentialRampToValueAtTime(0.26, t + 0.015);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o1.connect(f1).connect(g1).connect(audioCtx.destination);
  o1.start(t); o1.stop(t + 0.36);

  const start = t + 0.40;
  [1318.5, 1760, 2637].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, start + i * 0.075);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, start + i * 0.075);
    g.gain.exponentialRampToValueAtTime(0.24, start + i * 0.075 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, start + i * 0.075 + 0.45);
    o.connect(g).connect(audioCtx.destination);
    o.start(start + i * 0.075); o.stop(start + i * 0.075 + 0.5);
  });
}

function init(){
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xbfa070, 0.011);

  camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth/window.innerHeight, 0.1, 800);
  camera.position.set(playerX, terrainHeight(playerX, playerZ) + 1.72, playerZ);
  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference:'low-power' });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = false;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;

  document.getElementById('game').appendChild(renderer.domElement);

  buildSky();
  buildSun();

  setupEvents();

function buildSky(){
  const W = 2048, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0.00,'#0a1428'); g.addColorStop(0.18,'#1e3050');
  g.addColorStop(0.38,'#3c5070'); g.addColorStop(0.55,'#8a7080');
  g.addColorStop(0.70,'#d4906a'); g.addColorStop(0.82,'#f0b878');
  g.addColorStop(0.92,'#ffd9a0'); g.addColorStop(1.00,'#f5c890');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    const cx = Math.random()*W;
    const cy = H*0.30 + Math.random()*H*0.45;
    const rw = 80 + Math.random()*350;
    const rh = 20 + Math.random()*70;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rw,rh));
    const hue = cy < H*0.55 ? '90,120,180' : '255,190,130';
    const alpha = 0.08 + Math.random()*0.2;
    grad.addColorStop(0, `rgba(${hue},${alpha})`);
    grad.addColorStop(1, `rgba(${hue},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rw,rh,0,0,Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(450, 64, 40),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite:false, fog:false })
  );
  scene.add(sky);
}

function buildTerrain(){
  const size = 600;
  const segs = 180;
  const geo = new THREE.PlaneGeometry(size, size, segs, segs);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const px = pos.getX(i);
    const py = pos.getY(i);
    const worldZ = -py;
    const h = terrainHeight(px, worldZ);
    pos.setZ(i, h);
  }
  geo.computeVertexNormals();

  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#a68a5e';
  ctx.fillRect(0,0,512,512);
  for(let i=0;i<18000;i++){
    const x = Math.random()*512, y = Math.random()*512;
    const v = Math.random();
    const r = 175 + v*55;
    const g = 145 + v*50;
    const b = 95 + v*35;
    ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y, rand(1,3), rand(1,3));
  }
  for(let i=0;i<80;i++){
    const x = Math.random()*512, y = Math.random()*512;
    const r = rand(4,18);
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `rgba(90,70,50,${0.15+Math.random()*0.25})`;
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(35,35);
  tex.anisotropy = 4;

  const mat = new THREE.MeshStandardMaterial({
    map: tex, color: 0xb89565, roughness: 1, metalness: 0
  });
  const terrain = new THREE.Mesh(geo, mat);
  terrain.rotation.x = -Math.PI/2;
  terrain.receiveShadow = true;
  scene.add(terrain);
}

function buildEnvironment(){
  const mats = [
    new THREE.MeshStandardMaterial({ color:0x7a6850, roughness:.95 }),
    new THREE.MeshStandardMaterial({ color:0x5a5a65, roughness:.6, metalness:.55 }),
    new THREE.MeshStandardMaterial({ color:0x5f6a52, roughness:.9 }),
    new THREE.MeshStandardMaterial({ color:0x8a5a44, roughness:.9 }),
    new THREE.MeshStandardMaterial({ color:0x45454f, roughness:.7, metalness:.4 })
  ];
  for(let i=0;i<55;i++){
    const w = rand(.6,2.0), h = rand(.5,1.8), d = rand(.6,2.0);
    const box = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mats[i%5]);
    let x, z;
    if(Math.random() < 0.5){
      x = (Math.random()>.5 ? 1 : -1) * rand(38, 62);
      z = rand(-60, -5);
    } else {
      x = rand(-120, 120);
      z = rand(-260, -200);
    }
    const gy = terrainHeight(x, z);
    box.position.set(x, gy + h/2, z);
    box.rotation.y = rand(0,Math.PI);
    box.rotation.z = rand(-0.05, 0.05);
    box.castShadow = true; box.receiveShadow = true;
    scene.add(box);
  }

  const bMat = new THREE.MeshStandardMaterial({ color:0x4a4038, roughness:1 });
  const bMat2 = new THREE.MeshStandardMaterial({ color:0x5a5048, roughness:1 });
  const bMat3 = new THREE.MeshStandardMaterial({ color:0x4a5040, roughness:1 });
  const winMat = new THREE.MeshBasicMaterial({ color:0xffcc66, fog:false });
  for(let i=0;i<28;i++){
    const h = rand(8,30), w = rand(4,9);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,w), [bMat,bMat2,bMat3][i%3]);
    b.position.set(rand(-250,250), h/2, rand(-400,-280));
    b.rotation.y = rand(-0.3, 0.3);
    scene.add(b);
    if(Math.random()>.4){
      for(let k=0;k<7;k++){
        const win = new THREE.Mesh(new THREE.PlaneGeometry(0.7,1.0), winMat);
        win.position.set(
          b.position.x + rand(-w*0.35,w*0.35),
          rand(3, h-2),
          b.position.z + w/2 + 0.06
        );
        win.rotation.y = b.rotation.y;
        scene.add(win);
      }
    }
  }

  const trunkMat = new THREE.MeshStandardMaterial({ color:0x4a3420, roughness:1 });
  const leafColors = [0x4a5a32, 0x5a6a3a, 0x6a5a3a, 0x3a4a2a];
  for(let i=0;i<30;i++){
    const side = Math.random()>.5 ? 1 : -1;
    const x = side * rand(35,75);
    const z = rand(-80, -5);
    const gy = terrainHeight(x, z);
    const trunkH = rand(2.0, 3.2);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.14,.26,trunkH,7), trunkMat);
    trunk.position.set(x, gy + trunkH/2, z);
    trunk.rotation.z = rand(-0.08, 0.08);
    trunk.castShadow = true;
    scene.add(trunk);
    const leafMat = new THREE.MeshStandardMaterial({
      color: leafColors[i%4], roughness:1, flatShading:true
    });
    for(let k=0;k<4;k++){
      const leaves = new THREE.Mesh(
        new THREE.IcosahedronGeometry(rand(.9,1.6), 0),
        leafMat
      );
      leaves.position.set(x + rand(-.4,.4), gy + trunkH + rand(-.2,.6), z + rand(-.4,.4));
      leaves.rotation.set(rand(0,1), rand(0,1), rand(0,1));
      leaves.castShadow = true;
      scene.add(leaves);
    }
  }

  const rockMat = new THREE.MeshStandardMaterial({ color:0x5a4e42, roughness:1, flatShading:true });
  for(let i=0;i<40;i++){
    const r = rand(.4,1.3);
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), rockMat);
    const side = Math.random()>.5 ? 1 : -1;
    const x = side * rand(22,70);
    const z = rand(-65, 10);
    const gy = terrainHeight(x, z);
    rock.position.set(x, gy + r*0.4, z);
    rock.rotation.set(rand(0,Math.PI), rand(0,Math.PI), rand(0,Math.PI));
    rock.castShadow = true; rock.receiveShadow = true;
    scene.add(rock);
  }
}

function buildDust(){
  const N = 400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const vel = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]   = rand(-50,50);
    pos[i*3+1] = rand(0.5, 22);
    pos[i*3+2] = rand(-55, 25);
    vel[i*3]   = rand(-.18,.18);
    vel[i*3+1] = rand(.02,.15);
    vel[i*3+2] = rand(-.06,.06);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    color:0xffd9a0, size:0.13, sizeAttenuation:true,
    transparent:true, opacity:0.55, depthWrite:false,
    blending: THREE.AdditiveBlending, fog:true
  });
  const pts = new THREE.Points(geo, mat);
  pts.userData.vel = vel;
  scene.add(pts);
  dustPoints = pts;
}

function buildRain(){
  const N = 320;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const vel = new Float32Array(N);
  for(let i=0;i<N;i++){

function makeOptionSprite(optionNum){
  const S = 400;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  const outer = ctx.createRadialGradient(S/2, S/2, S*0.15, S/2, S/2, S*0.5);
  outer.addColorStop(0,'rgba(0,229,255,.4)');
  outer.addColorStop(0.5,'rgba(0,150,255,.15)');
  outer.addColorStop(1,'rgba(0,229,255,0)');
  ctx.fillStyle = outer; ctx.fillRect(0,0,S,S);

  ctx.beginPath();
  ctx.arc(S/2, S/2, S*0.40, 0, Math.PI*2);
  const grd = ctx.createRadialGradient(S/2 - 40, S/2 - 40, 10, S/2, S/2, S*0.40);
  grd.addColorStop(0,'rgba(60,110,170,.98)');
  grd.addColorStop(0.5,'rgba(15,45,85,.98)');
  grd.addColorStop(1,'rgba(0,10,25,.98)');
  ctx.fillStyle = grd; ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(S/2, S/2, S*0.40, 0, Math.PI*2);
  ctx.clip();
  for(let y=0;y<S;y+=6){
    ctx.fillStyle = 'rgba(0,229,255,.06)';
    ctx.fillRect(0, y, S, 2);
  }
  ctx.restore();

  ctx.lineWidth = 14;
  ctx.strokeStyle = '#00e5ff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 44;
  ctx.stroke();
  ctx.shadowBlur = 0;

  for(let a=0;a<24;a++){
    const ang = a * (Math.PI*2/24);
    const x1 = S/2 + Math.cos(ang) * S*0.40;
    const y1 = S/2 + Math.sin(ang) * S*0.40;
    const x2 = S/2 + Math.cos(ang) * (S*0.40 - 8);
    const y2 = S/2 + Math.sin(ang) * (S*0.40 - 8);
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,229,255,.5)';
    ctx.stroke();
  }

  ctx.font = 'bold 260px Tahoma, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 45;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(toFa(optionNum), S/2, S/2 + 15);
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#c8f4ff';
  ctx.fillText(toFa(optionNum), S/2, S/2 + 15);
  ctx.shadowBlur = 0;

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.anisotropy = 4;

  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthTest:true, depthWrite:false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(1.0, 1.0, 1);
  return sp;
}

  pack.position.set(0, 1.16, -0.30);
  pack.castShadow = true;
  pack.userData.part = 'body'; g.add(pack);

  const strapL = new THREE.Mesh(new THREE.BoxGeometry(.06,.75,.06), dark);
  strapL.position.set(-.20, 1.20, .20); strapL.userData.part = 'body'; g.add(strapL);
  const strapR = new THREE.Mesh(new THREE.BoxGeometry(.06,.75,.06), dark);
  strapR.position.set(.20, 1.20, .20); strapR.userData.part = 'body'; g.add(strapR);

  const sprite = makeOptionSprite(optionNum);
  sprite.position.y = 2.35;
  g.add(sprite);

  g.userData = {
    optionNum,
    isCorrect,
    alive: true,
    deathT: 0,
    head, torso, vest, sprite,
    baseZ: 0,
    minX: -8, maxX: 8,
    speed: rand(0.5, 1.1),
    dir: Math.random()>.5 ? 1 : -1,
    phase: rand(0, Math.PI*2),
    bobAmp: rand(0.025, 0.06),
    hideTimer: 0,
    hideDuration: 0,
    hideAlpha: 0,
    wasHiding: false,
    wanderTimer: rand(1.5, 4),
    isHead: false,
    fallSpeed: 2.2,
    hitMeshes: [],
    materials: new Set()
  };

  g.traverse(o=>{
    if(o.isMesh && o.material){
      if(Array.isArray(o.material)){
        o.material.forEach(m => g.userData.materials.add(m));
      } else {
        g.userData.materials.add(o.material);
      }
      o.userData.enemy = g;
      if(!o.userData.part) o.userData.part = 'body';
      g.userData.hitMeshes.push(o);
    }
  });

  return g;
}

function newRound(){
  roundTransitioning = false;
  lastShotHit = false;
  if (gameFinished) return;
  enemies.forEach(e=> scene.remove(e));
  enemies = [];
  hitboxes = [];
  roundLocked = false;
  gameActive = true;
  timeScale = 1;
  slowmoTimer = 0;
  slowmoBar.style.opacity = 0;
  bulletTime.classList.remove('active');

  pendingReveal = null;
  optEls.forEach(el => el.classList.remove('mark-wrong','mark-right'));

  tracers.forEach(t=> scene.remove(t.mesh));
  tracers = [];
  casings.forEach(c => scene.remove(c.mesh));
  casings = [];

  if (studyQuestions.length > 0 && currentQIndex >= studyQuestions.length) {
    showFinishModal(coins);
    return;
  }
  const q = fixHalfSpace(studyQuestions[currentQIndex]);
  currentQIndex++;
  currentQuestion = q;
  correctOption = q.correct + 1;

  qEl.textContent = q.q;

  for(let i=0;i<4;i++){
    const el = optEls[i];
    const opt = q.options[i];
    el.querySelector('.opt-num').textContent = toFa(i+1);
    el.querySelector('.opt-emoji').textContent = opt.emoji;
    el.querySelector('.opt-text').textContent = opt.text;
  }

  const positions = [
    { x: -16, z: -30 },
    { x:  -6, z: -22 },
    { x:   6, z: -26 },
    { x:  17, z: -34 }
  ];

  const perm = [1,2,3,4];
  for(let i=perm.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [perm[i],perm[j]] = [perm[j],perm[i]];
  }

  positions.forEach((p, i)=>{
    const optionNum = perm[i];
    const isCorrect = (optionNum === correctOption);
    const e = createEnemy(optionNum, isCorrect);
    const gy = terrainHeight(p.x, p.z);
    e.position.set(p.x, gy, p.z);
    e.userData.baseZ = p.z;
    e.userData.minX = p.x - 2.5;
    e.userData.maxX = p.x + 2.5;
    scene.add(e);
    enemies.push(e);
    e.userData.hitMeshes.forEach(m => hitboxes.push(m));
  });
}

let lastShotHit = false;

function shoot(){
  if(!gameActive || roundLocked) return;

  playShotSound();
  lastShotHit = false;

  recoilOffset += 0.08;
  shakeAmt = 1.1;
  cameraRoll += rand(-0.02, 0.02);

  muzzleEl.style.transition = 'none';
  muzzleEl.style.opacity = '1';
  requestAnimationFrame(()=>{
    muzzleEl.style.transition = 'opacity .2s ease-out';
    muzzleEl.style.opacity = '0';
  });

  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.6';
  requestAnimationFrame(()=>{
    flashEl.style.transition = 'opacity .32s ease-out';
    flashEl.style.opacity = '0';
  });

  spawnCasing();

  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0,0), camera);
  ray.far = 500;

  const raw = ray.intersectObjects(hitboxes, false);
  const hits = raw.filter(h => {
    const e = h.object.userData.enemy;
    return e && e.userData.alive && e.userData.hideAlpha < 0.5;
  });

  if(hits.length === 0){
    lastShotHit = false;
    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();
    const far = camera.position.clone().addScaledVector(dir, 200);
    spawnTracer(far);
    checkNearMiss(dir);
    onMiss();
    return;
  }

  lastShotHit = true;

  const hit   = hits[0];
  const enemy = hit.object.userData.enemy;
  const part  = hit.object.userData.part;
  const point = hit.point;

  spawnTracer(point);
  spawnImpactSparks(point);

  if(enemy.userData.isCorrect){
    if(part === 'head') onHeadshot(enemy, point);
    else                onBodyshot(enemy, point);
  } else {
    onWrongTarget(enemy, point);
  }
}

function checkNearMiss(dir){
  const origin = camera.position.clone();
  let bestDist = 3.0;
  let bestEnemy = null;
  for(const e of enemies){
    if(!e.userData.alive) continue;
    if(e.userData.hideTimer > 0) continue;
    const center = new THREE.Vector3(e.position.x, e.position.y + 1.2, e.position.z);
    const toE = center.clone().sub(origin);
    const t = toE.dot(dir);
    if(t < 3 || t > 250) continue;
    const closest = origin.clone().addScaledVector(dir, t);
    const d = closest.distanceTo(center);
    if(d < bestDist){
      bestDist = d;
      bestEnemy = e;
    }
  }
  if(bestEnemy) triggerHide(bestEnemy);
}

function triggerHide(enemy){
  if(!enemy.userData.alive) return;
  if(enemy.userData.hideTimer > 0) return;
  const dur = rand(2.0, 3.8);
  enemy.userData.hideTimer = dur;
  enemy.userData.hideDuration = dur;
  enemy.userData.hideAlpha = 0;
}

function spawnTracer(endPoint){
  const start = new THREE.Vector3(0.35, -0.25, -0.7).applyQuaternion(camera.quaternion).add(camera.position);
  const dir = endPoint.clone().sub(start);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(0.016, 0.016, len, 6);
  const mat = new THREE.MeshBasicMaterial({
    color:0xffddaa, transparent:true, opacity:1,
    blending: THREE.AdditiveBlending, depthWrite:false, fog:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(start).addScaledVector(dir.clone().normalize(), len/2);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  scene.add(mesh);
  tracers.push({ mesh, life: 0.09, maxLife: 0.09 });
}

function updateParticles(delta, rawDelta){
  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    if(p.isRing){
      p.userData.life -= rawDelta;
      const k = clamp(p.userData.life / p.userData.maxLife, 0, 1);
      const s = 1 + (1 - k) * 6;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = k;
      if(p.userData.life <= 0){
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
        particles.splice(i,1);
      }
      continue;
    }
    p.userData.vel.y -= p.userData.grav * delta;
    p.position.addScaledVector(p.userData.vel, delta);
    const gy = terrainHeight(p.position.x, p.position.z) + 0.03;
    if(p.position.y < gy){
      p.position.y = gy;
      p.userData.vel.y *= -0.32;
      p.userData.vel.x *= 0.7;
      p.userData.vel.z *= 0.7;
    }
    p.userData.life -= rawDelta;
    const k = clamp(p.userData.life / p.userData.maxLife, 0, 1);
    p.material.opacity = k;
    p.scale.setScalar(0.4 + k*0.75);
    if(p.userData.life <= 0){
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      particles.splice(i,1);
    }
  }
}

function updateTracers(rawDelta){
  for(let i=tracers.length-1;i>=0;i--){
    const t = tracers[i];
    t.life -= rawDelta;
    t.mesh.material.opacity = Math.max(0, t.life / t.maxLife) * 0.95;
    if(t.life <= 0){
      scene.remove(t.mesh);
      t.mesh.geometry.dispose();
      t.mesh.material.dispose();
      tracers.splice(i,1);
    }
  }
}

function updateCasings(rawDelta){
  for(let i=casings.length-1;i>=0;i--){
    const c = casings[i];
    c.vel.y -= 18 * rawDelta;
    c.mesh.position.addScaledVector(c.vel, rawDelta);
    c.mesh.rotation.x += c.angVel.x * rawDelta;
    c.mesh.rotation.y += c.angVel.y * rawDelta;
    c.mesh.rotation.z += c.angVel.z * rawDelta;
    const gy = terrainHeight(c.mesh.position.x, c.mesh.position.z) + 0.05;
    if(c.mesh.position.y < gy){
      c.mesh.position.y = gy;
      c.vel.y *= -0.35;
      c.vel.x *= 0.7; c.vel.z *= 0.7;
      c.angVel.multiplyScalar(0.7);
    }
    c.life -= rawDelta;
    if(c.life <= 0){
      scene.remove(c.mesh);
      c.mesh.geometry.dispose();
      c.mesh.material.dispose();
      casings.splice(i,1);
    }
  }
}

function updateBloodDecals(rawDelta){
  for(let i=bloodDecals.length-1;i>=0;i--){
    const b = bloodDecals[i];
    b.life -= rawDelta;
    if(b.life < 2){
      b.mesh.material.opacity = b.life / 2 * 0.85;
    }
    if(b.life <= 0){
      scene.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
      bloodDecals.splice(i,1);
    }
  }
}

function isOnFireBtn(x, y){
  const r = fireBtn.getBoundingClientRect();
  const pad = 18;
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}

function isOnJoystick(x, y){
  const r = joystickEl.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const dx = x - cx, dy = y - cy;
  const radius = r.width/2 + 15;
  return dx*dx + dy*dy < radius*radius;
}

function updateJoystickFromTouch(t){
  const r = joystickEl.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const maxR = r.width * 0.34;
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > maxR){
    dx = dx / dist * maxR;
    dy = dy / dist * maxR;
  }
  joyHandle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyX = dx / maxR;
  joyY = -dy / maxR;
}

function resetJoystick(){
  joyX = 0; joyY = 0;
  joyHandle.classList.remove('active');
  joyHandle.style.transform = 'translate(-50%, -50%)';
  joystickActive = false;
  topBarEl.classList.remove('hidden');
  updateMultBadge();
}

function setupEvents(){

  document.addEventListener('touchstart', onTouchStart, { passive:false });
  document.addEventListener('touchmove',  onTouchMove,  { passive:false });
  document.addEventListener('touchend',   onTouchEnd,   { passive:false });
  document.addEventListener('touchcancel',onTouchEnd,   { passive:false });

  fireBtn.addEventListener('touchstart', e=>{
    e.preventDefault(); e.stopPropagation();
    if(roundLocked || roundTransitioning || !gameActive || gameFinished) return;
    initAudio();
    const t = e.changedTouches[0];
    if(t && fireTouchId === null){
      fireTouchId = t.identifier;
      lastTX = t.clientX;
      lastTY = t.clientY;
    }
    fireBtn.classList.add('pressed');
    startScope();
  }, { passive:false });

  fireBtn.addEventListener('touchend', e=>{
    e.preventDefault(); e.stopPropagation();
    fireBtn.classList.remove('pressed');
    for(const t of e.changedTouches){
      if(t.identifier === fireTouchId) fireTouchId = null;
    }
    endScopeAndShoot();
  }, { passive:false });

  fireBtn.addEventListener('touchcancel', e=>{
    e.preventDefault(); e.stopPropagation();
    fireBtn.classList.remove('pressed');
    for(const t of e.changedTouches){
      if(t.identifier === fireTouchId) fireTouchId = null;
    }
    endScopeAndShoot();
  }, { passive:false });

  fireBtn.addEventListener('mousedown', e=>{
    e.preventDefault();
    if(roundLocked || roundTransitioning || !gameActive || gameFinished) return;
    initAudio();
    fireBtn.classList.add('pressed');
    startScope();
  });
  window.addEventListener('mouseup', e=>{
    if(isScoped){ fireBtn.classList.remove('pressed'); endScopeAndShoot(); }
  });

  let mLastX = 0, mLastY = 0, mDrag = false;
  renderer.domElement.addEventListener('mousedown', e=>{
    if(isOnFireBtn(e.clientX,e.clientY)) return;
    if(isOnJoystick(e.clientX,e.clientY)) return;
    mDrag = true; mLastX = e.clientX; mLastY = e.clientY;
  });
  window.addEventListener('mousemove', e=>{
    if(!mDrag) return;
    const dx = e.clientX - mLastX, dy = e.clientY - mLastY;
    mLastX = e.clientX; mLastY = e.clientY;
    applyAim(dx, dy);
  });
  window.addEventListener('mouseup', ()=>{ mDrag = false; });

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', ()=> setTimeout(onResize, 250));
}

function initAudioOnce(){
  const once = ()=>{ initAudio(); document.removeEventListener('touchstart', once); document.removeEventListener('mousedown', once); };
  document.addEventListener('touchstart', once, { once:true });
  document.addEventListener('mousedown', once, { once:true });
}

function onTouchStart(e){
  for(const t of e.changedTouches){
    if(isOnFireBtn(t.clientX, t.clientY)) continue;
    if(isOnJoystick(t.clientX, t.clientY)){
      if(joyTouchId === null){
        joyTouchId = t.identifier;
        joyHandle.classList.add('active');
        joystickActive = true;
        topBarEl.classList.add('hidden');
        updateMultBadge();
        updateJoystickFromTouch(t);
      }
      continue;
    }
    if(aimTouchId === null){
      aimTouchId = t.identifier;
      lastTX = t.clientX;
      lastTY = t.clientY;
    }
  }
}

function onTouchMove(e){
  for(const t of e.changedTouches){
    if(t.identifier === joyTouchId){
      e.preventDefault();
      updateJoystickFromTouch(t);
      continue;
    }
    if(t.identifier === fireTouchId){
      e.preventDefault();
      const dx = t.clientX - lastTX;
      const dy = t.clientY - lastTY;
      lastTX = t.clientX;
      lastTY = t.clientY;
      applyAim(dx, dy);
      continue;
    }
    if(t.identifier === aimTouchId){
      e.preventDefault();
      const dx = t.clientX - lastTX;
      const dy = t.clientY - lastTY;
      lastTX = t.clientX;
      lastTY = t.clientY;
      applyAim(dx, dy);
    }
  }
}

function onTouchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier === joyTouchId){
      joyTouchId = null;
      resetJoystick();
    }
    if(t.identifier === aimTouchId) aimTouchId = null;
    if(t.identifier === fireTouchId) fireTouchId = null;
  }
}

function applyAim(dx, dy){
  const sens = isScoped ? 0.0012 : 0.0050;
  yaw   -= dx * sens;
  pitch -= dy * sens;
  yaw   = clamp(yaw,   -3.14, 3.14);
  pitch = clamp(pitch, -0.95, 0.65);
}

function startScope(){
  if(roundLocked || roundTransitioning || !gameActive || gameFinished) return;
  if(scopeTimer){ clearTimeout(scopeTimer); scopeTimer = null; }
  isScoped = true;
  scopeEl.classList.add('active');
  hipCross.classList.add('hide');
  if (typeof topBarEl !== 'undefined' && topBarEl) topBarEl.classList.add('hidden');

  if(!scopeTipShown){
    scopeTipShown = true;
    setTimeout(()=>{ if(isScoped) scopeTipEl.classList.add('show'); }, 260);
    if(scopeTipTimer) clearTimeout(scopeTipTimer);
    scopeTipTimer = setTimeout(()=> scopeTipEl.classList.remove('show'), 5200);
  }
  if(navigator.vibrate) navigator.vibrate(10);
}

function endScopeAndShoot(){
  if(!isScoped) return;
  isScoped = false;
  if(roundLocked || roundTransitioning || !gameActive || gameFinished){
    scopeEl.classList.remove('active');
    hipCross.classList.remove('hide');
    scopeTipEl.classList.remove('show');
    if (typeof topBarEl !== 'undefined' && topBarEl) topBarEl.classList.remove('hidden');
    return;
  }
  shoot();
  if(scopeTimer){ clearTimeout(scopeTimer); scopeTimer = null; }
  scopeTimer = setTimeout(()=>{
    scopeEl.classList.remove('active');
    hipCross.classList.remove('hide');
    scopeTipEl.classList.remove('show');
    if (typeof topBarEl !== 'undefined' && topBarEl) topBarEl.classList.remove('hidden');

    const ht = fxLayer.querySelectorAll('.hit-text');
    ht.forEach(el => el.remove());

    if (lastShotHit && !roundTransitioning) {
      roundTransitioning = true;
      if(pendingReveal){
        const info = pendingReveal;
        pendingReveal = null;
        revealOptions(info);
        setTimeout(()=>{ if(!document.hidden) newRound(); }, 1800);
      } else {
        newRound();
      }
    }

    scopeTimer = null;
  }, 1500);
}

/* =========================================================
   ANIMATE
   ========================================================= */
function animate(){
  requestAnimationFrame(animate);

  const rawDelta = Math.min(clock.getDelta(), 0.05);

  if(slowmoTimer > 0){
    slowmoTimer -= rawDelta;
    if(slowmoTimer <= 0){
      slowmoBar.style.opacity = 0;
      bulletTime.classList.remove('active');
    }
  }
  timeScale += (1 - timeScale) * Math.min(1, rawDelta * 2.6);

  if(comboTimer > 0){
    comboTimer -= rawDelta;
    if(comboTimer <= 0){
      combos = 0;
      comboBox.classList.remove('show');
    }
  }

  lightningTimer -= rawDelta;
  if(lightningTimer <= 0){
    triggerLightning();
    lightningTimer = rand(12, 25);
  }

  const delta = rawDelta * timeScale;

  if(Math.abs(joyX) > 0.02 || Math.abs(joyY) > 0.02){
    const fwdX = -Math.sin(yaw);
    const fwdZ = -Math.cos(yaw);
    const rightX =  Math.cos(yaw);
    const rightZ = -Math.sin(yaw);
    const moveSpeed = isScoped ? 1.6 : 3.6;
    const mx = (fwdX * joyY + rightX * joyX) * moveSpeed * rawDelta;
    const mz = (fwdZ * joyY + rightZ * joyX) * moveSpeed * rawDelta;
    playerX += mx;
    playerZ += mz;
    playerX = clamp(playerX, -100, 100);
    playerZ = clamp(playerZ, -140, 60);
  }

  updateEnemies(delta, rawDelta);
  updateParticles(delta, rawDelta);
  updateTracers(rawDelta);
  updateCasings(rawDelta);
  updateBloodDecals(rawDelta);
  updateDust(rawDelta);
  updateRain(rawDelta);
  updateSun(rawDelta);
  updateCamera(rawDelta);
  updateMultBadge();

  renderer.render(scene, camera);
}

function triggerLightning(){
  lightningEl.style.transition = 'opacity .05s';
  lightningEl.style.opacity = rand(0.35, 0.75);
  setTimeout(()=>{
    lightningEl.style.transition = 'opacity .3s';
    lightningEl.style.opacity = '0';
  }, 60);
  setTimeout(()=>{
    lightningEl.style.transition = 'opacity .04s';
    lightningEl.style.opacity = rand(0.2, 0.5);
    setTimeout(()=>{
      lightningEl.style.transition = 'opacity .5s';
      lightningEl.style.opacity = '0';
    }, 50);
  }, 120);
  playThunderSound();
}

function updateEnemies(delta, rawDelta){
  const playerProgress = getPlayerProgress();
  const enemyRetreat = playerProgress * 1.5;

  for(const e of enemies){
    const d = e.userData;

    e.position.z = d.baseZ - enemyRetreat;

    if(d.alive){
      if(d.hideTimer > 0){
        d.hideTimer -= rawDelta;
        const elapsed = d.hideDuration - d.hideTimer;
        let alpha;
        const ENTER = 0.18, EXIT = 0.28;
        if(elapsed < ENTER){ alpha = elapsed / ENTER; }
        else if(d.hideTimer < EXIT){ alpha = d.hideTimer / EXIT; }
        else { alpha = 1; }
        d.hideAlpha = clamp(alpha, 0, 1);
        if(d.hideTimer <= 0){ d.hideTimer = 0; d.hideAlpha = 0; }
      } else {
        d.hideAlpha = 0;
      }

      const op = 1 - d.hideAlpha;
      if(d.hideAlpha > 0.001){
        d.materials.forEach(m => {
          if(!m.transparent) m.transparent = true;
          m.opacity = op;
        });
        if(d.sprite) d.sprite.material.opacity = op;
        d.wasHiding = true;
      } else if(d.wasHiding){
        d.materials.forEach(m => {
          m.transparent = false;
          m.opacity = 1;
        });
        if(d.sprite) d.sprite.material.opacity = 1;
        d.wasHiding = false;
      }

      d.wanderTimer -= rawDelta;
      if(d.wanderTimer <= 0){
        if(Math.random() < 0.4) d.dir *= -1;
        d.wanderTimer = rand(1.5, 4);
      }

      if(d.hideTimer <= 0){
        e.position.x += d.speed * d.dir * delta;
        if(e.position.x > d.maxX){ e.position.x = d.maxX; d.dir = -1; }
        if(e.position.x < d.minX){ e.position.x = d.minX; d.dir = 1; }
      }

      d.phase += delta * 7.5;
      const bob = Math.abs(Math.sin(d.phase)) * d.bobAmp;

      const gy = terrainHeight(e.position.x, e.position.z);
      const sink = d.hideAlpha * 0.55;
      e.position.y = gy + bob - sink;

      const dx = playerX - e.position.x;
      const dz = playerZ - e.position.z;
      const targetRotY = Math.atan2(dx, dz);
      let diff = targetRotY - e.rotation.y;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      e.rotation.y += diff * Math.min(1, rawDelta * 5);

      e.rotation.z = Math.sin(d.phase) * 0.03;
      if(d.vest) d.vest.scale.y = 1 + Math.sin(d.phase*0.5) * 0.02;
    } else {
      d.deathT += delta * d.fallSpeed;
      const t = Math.min(1, d.deathT);
      const ease = 1 - Math.pow(1 - t, 3);
      e.rotation.x = -ease * (d.isHead ? 1.62 : 1.15);
      e.rotation.z = ease * (d.isHead ? 0.28 : 0.12) * (d.dir > 0 ? 1 : -1);
      const gy = terrainHeight(e.position.x, e.position.z);
      e.position.y = gy - ease * 0.22;
      if(t > 0.75){
        const k = 1 - (t - 0.75) / 0.25;
        e.traverse(o=>{
          if(o.isMesh && o.material && o.material.transparent !== true){
            o.material.transparent = true;
          }
          if(o.isMesh && o.material) o.material.opacity = k;
        });
        if(e.userData.sprite) e.userData.sprite.material.opacity = 0;
      }
    }
  }
}

function updateDust(rawDelta){
  if(!dustPoints) return;
  const pos = dustPoints.geometry.attributes.position.array;
  const vel = dustPoints.userData.vel;
  for(let i=0;i<pos.length;i+=3){
    pos[i]   += vel[i]   * rawDelta;
    pos[i+1] += vel[i+1] * rawDelta;
    pos[i+2] += vel[i+2] * rawDelta;
    if(pos[i+1] > 24){ pos[i+1] = 0.5; pos[i] = rand(-50,50); pos[i+2] = rand(-55,25); }
    if(pos[i] > 55) pos[i] = -55;
    if(pos[i] < -55) pos[i] = 55;
  }
  dustPoints.geometry.attributes.position.needsUpdate = true;
}

function updateRain(rawDelta){
  if(!rainDrops) return;
  const pos = rainDrops.geometry.attributes.position.array;
  const vel = rainDrops.userData.vel;
  for(let i=0;i<pos.length;i+=3){
    pos[i+1] -= vel[i/3] * rawDelta;
    pos[i] += 2.5 * rawDelta;
    if(pos[i+1] < 0){
      pos[i+1] = 30;
      pos[i] = rand(-60,60);
      pos[i+2] = rand(-70,30);
    }
    if(pos[i] > 70) pos[i] = -60;
  }
  rainDrops.geometry.attributes.position.needsUpdate = true;
}

function updateSun(rawDelta){
  const t = performance.now();
  if(sunSprite){
    const pulse = 1 + Math.sin(t*0.0008) * 0.04;
    sunSprite.scale.set(110*pulse, 110*pulse, 1);
  }
  if(godRays){
    const p = 1 + Math.sin(t*0.0005) * 0.06;
    godRays.material.opacity = 0.8 + Math.sin(t*0.0007) * 0.12;
    godRays.scale.set(300*p, 300*p, 1);
  }
}

function updateCamera(rawDelta){
  recoilOffset *= Math.pow(0.00012, rawDelta);
  if(recoilOffset < 0.0005) recoilOffset = 0;

  shakeAmt *= Math.pow(0.0006, rawDelta);
  if(shakeAmt < 0.002) shakeAmt = 0;
  const shX = (Math.random()-0.5) * shakeAmt * 0.02;
  const shY = (Math.random()-0.5) * shakeAmt * 0.02;

  cameraRoll *= Math.pow(0.0008, rawDelta);
  if(Math.abs(cameraRoll) < 0.0005) cameraRoll = 0;

  const t = performance.now() * 0.001;
  const brY = (Math.sin(t*1.35) * 0.0026 + Math.sin(t*0.63) * 0.0016);
  const brX = (Math.cos(t*1.05) * 0.0022 + Math.sin(t*0.47) * 0.0013);

  camera.rotation.y = yaw   + brX + shX;
  camera.rotation.x = pitch + recoilOffset + brY + shY;
  camera.rotation.z = cameraRoll;

  const targetX = playerX;
  const targetZ = playerZ;
  const targetY = terrainHeight(playerX, playerZ) + 1.72;
  camera.position.x += (targetX - camera.position.x) * Math.min(1, rawDelta * 22);
  camera.position.z += (targetZ - camera.position.z) * Math.min(1, rawDelta * 22);
  camera.position.y += (targetY - camera.position.y) * Math.min(1, rawDelta * 14);

  const targetFov = isScoped ? SCOPE_FOV : BASE_FOV;
  camera.fov += (targetFov - camera.fov) * Math.min(1, rawDelta * 26);
  camera.updateProjectionMatrix();
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(1);
  renderer.setSize(w, h);
}

init();
</script>
