<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سنگ‌های معنی | بازی عربی هفتم</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05050d;}
  body{
    font-family:'Vazirmatn','Tahoma','Segoe UI',sans-serif;
    user-select:none;-webkit-user-select:none;
  }
  #game{position:fixed;inset:0;display:block;touch-action:manipulation;cursor:pointer;}

  /* ---------- HUD ---------- */
  .pill{
    position:fixed;top:10px;z-index:12;pointer-events:none;
    display:flex;align-items:center;gap:7px;
    padding:7px 16px;border-radius:999px;
    font-weight:900;font-size:clamp(14px,3.5vw,20px);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    white-space:nowrap;
  }
  .coin-box{
    left:12px;
    color:#ffd97a;
    background:linear-gradient(145deg,rgba(255,215,120,.20),rgba(255,150,40,.07));
    border:1.6px solid rgba(255,200,90,.55);
    box-shadow:0 0 20px rgba(255,180,60,.32),inset 0 0 16px rgba(255,200,100,.12);
  }
  .round-box{
    right:12px;
    color:#c8b6ff;
    background:linear-gradient(145deg,rgba(140,120,255,.20),rgba(80,60,200,.07));
    border:1.6px solid rgba(150,130,255,.55);
    box-shadow:0 0 20px rgba(120,90,255,.32),inset 0 0 16px rgba(140,110,255,.12);
  }
  .coin-box span,.round-box span{font-size:1.1em;}

  /* ---------- Word card ---------- */
  .word-card{
    position:fixed;top:62px;left:50%;transform:translateX(-50%);
    z-index:12;pointer-events:none;text-align:center;
    padding:7px 30px 13px;border-radius:24px;
    background:linear-gradient(160deg,rgba(72,46,132,.92),rgba(24,14,48,.95));
    border:2px solid rgba(170,130,255,.55);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    animation:cardGlow 3.4s ease-in-out infinite;
    max-width:94vw;
  }
  @keyframes cardGlow{
    0%,100%{box-shadow:0 0 26px rgba(130,80,255,.42),inset 0 0 26px rgba(120,80,255,.14);}
    50%{box-shadow:0 0 48px rgba(165,115,255,.78),inset 0 0 34px rgba(140,100,255,.24);}
  }
  .word-card .hint{
    font-size:clamp(10px,2.5vw,13px);
    color:#b9a6ff;opacity:.88;letter-spacing:.3px;margin-bottom:1px;
  }
  .word-card .word{
    font-size:clamp(26px,7vw,50px);
    font-weight:900;color:#fff;line-height:1.55;
    text-shadow:0 0 16px rgba(190,150,255,.95),0 0 44px rgba(140,90,255,.7);
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;top:48%;z-index:20;
    transform:translate(-50%,-50%);
    font-size:clamp(24px,6vw,48px);font-weight:900;
    opacity:0;pointer-events:none;white-space:nowrap;
    padding:0 10px;
  }
  #toast.show{animation:toastPop 1.5s cubic-bezier(.2,.9,.3,1.2) forwards;}
  @keyframes toastPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-9deg);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg);}
    32%{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1.02);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.35);}
  }

  @media (max-height:600px){
    .word-card{top:54px;padding:4px 22px 8px;border-radius:18px;}
    .word-card .word{font-size:clamp(20px,6vh,34px);line-height:1.35;}
    .word-card .hint{font-size:10px;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="pill coin-box">🪙 <span id="coins">۰</span></div>
<div class="pill round-box">🏁 مرحله <span id="round">۱</span></div>

<div class="word-card">
  <div class="hint">معنی این کلمه کدام است؟</div>
  <div class="word" id="word">دِیک</div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0) ابزارهای پایه
   ========================================================= */
const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const toastEl = document.getElementById('toast');
const coinsEl = document.getElementById('coins');
const roundEl = document.getElementById('round');
const wordEl  = document.getElementById('word');
const cardEl  = document.querySelector('.word-card');

const rnd   = (a,b)=> a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const toFa  = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* =========================================================
   1) بانک کلمات — پویا (دریافت از فلاتر)
   ========================================================= */
let WORDS = [];
let isLesson20 = false;
window.setGameWords = function(wordsJson, lessonKey) {
    try {
        WORDS = typeof wordsJson === 'string' ? JSON.parse(wordsJson) : wordsJson;
        isLesson20 = (lessonKey === 'lesson20');
        if (typeof startRound === 'function' && WORDS && WORDS.length > 0) {
            currentWordIndex = 0;
            roundNum = 1;
            if(roundEl) roundEl.textContent = toFa(roundNum);
            startRound();
        }
    } catch(e) {
        console.error("Error setting game words:", e);
    }
};

/* =========================================================
   2) صدا
   ========================================================= */
let actx = null;
function A(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f1, dur, type, vol, f2){
  const a = A(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, a.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + dur);
  g.gain.setValueAtTime(vol || .12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + .02);
}
function noiseBurst(dur, vol, cut){
  const a = A(); if(!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value = cut || 1400;
  const g = a.createGain(); g.gain.value = vol || .3;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}
const SFX = {
  fire(){ tone(180,.22,'sawtooth',.07,900); noiseBurst(.18,.14,2600); },
  boom(){ noiseBurst(.65,.4,900); tone(140,.55,'sine',.22,38); },
  coin(){ tone(950,.07,'square',.10); setTimeout(()=>tone(1400,.14,'square',.09),70); },
  err(){ tone(240,.30,'square',.11,110); noiseBurst(.25,.12,600); },
  land(){ noiseBurst(.25,.18,500); },
  finish(){ [0,1,2,3].forEach(i=>setTimeout(()=>tone(660+i*220,.22,'triangle',.12),i*130)); }
};

/* =========================================================
   3) وضعیت بازی
   ========================================================= */
let W=0, H=0, DPR=1, groundY=0, spawnY=200;

let stones   = [];
let missiles = [];
let particles= [];
let rings    = [];
let floats   = [];
let stars    = [];
let skyGrad  = null;

let state = 'playing';   // playing | firing | win | lose | timeout | over
let coins = 0;
let roundNum = 1;
let currentWordIndex = 0;   /* ★ ایندکس کلمه‌ی فعلی در آرایه‌ی WORDS */
let correctIndex = 0;
let correctWord = null;

let shake = 0, flash = 0;
let nextTimer = 0;
let crashDelay = 0;

let turretAngle = -Math.PI/2;
let turretTarget = -Math.PI/2;

const GRAV = 52;
const TERM = 62;
const MISSILE_SPEED = 680;
const MISSILE_TURN  = 14.0;

/* =========================================================
   4) ریسایز
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  groundY = H - Math.max(78, H*0.155);
  skyGrad = null;

  stars = [];
  const n = Math.round((W*H) / 14000);
  for(let i=0;i<n;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.72,
      r: rnd(0.6, 1.9),
      sp: rnd(0.6, 2.4),
      ph: rnd(0, Math.PI*2),
      c: pick(['#ffffff','#cfd8ff','#ffe9c4','#c9b6ff'])
    });
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 120));

/* =========================================================
   5) شکل سنگ
   ========================================================= */
function makeShape(){
  const n = 9, pts = [];
  for(let i=0;i<n;i++){
    pts.push({ a: (i/n)*Math.PI*2 + rnd(-0.12,0.12), r: rnd(0.80, 1.06) });
  }
  return pts;
}

/* =========================================================
   6) شروع مرحله — کلمه‌ها فقط یک‌بار به ترتیب
   ========================================================= */
function startRound(){
  /* ★ اگر همه‌ی کلمات تمام شدند → پایان بازی */
  if(currentWordIndex >= WORDS.length){
    endGame();
    return;
  }

  state = 'playing';
  missiles = []; particles = []; rings = []; floats = [];
  shake = 0; flash = 0; crashDelay = 0;

  /* ★ کلمه‌ی درست بر اساس ترتیب، سپس رفتن به کلمه‌ی بعدی */
  correctWord = WORDS[currentWordIndex];
  currentWordIndex++;

  /* ۳ گزینه‌ی دیگر به‌صورت تصادفی از بقیه‌ی کلمات */
  const opts = [correctWord];
  const isDayOfWeek = correctWord.emoji && correctWord.emoji.includes('🗓️');
  let guard = 0;
  while(opts.length < 4 && guard++ < 500){
    const c = pick(WORDS);
    if(opts.some(o => o.emoji === c.emoji)) continue;
    const cIsDay = c.emoji && c.emoji.includes('🗓️');
    if(isDayOfWeek !== cIsDay) continue;
    opts.push(c);
  }
  if(opts.length < 4){
    while(opts.length < 4 && guard++ < 1000){
      const c2 = pick(WORDS);
      if(opts.some(o => o.emoji === c2.emoji)) continue;
      opts.push(c2);
    }
  }
  shuffle(opts);
  correctIndex = opts.indexOf(correctWord);
  wordEl.textContent = correctWord.ar;

  let r  = clamp(W*0.072, 33, 62);
  if(isLesson20) r = clamp(W*0.056, 24, 44);

  const pad = r + (isLesson20 ? 18 : 10);
  const slotW = (W - pad*2) / 4;

  const cardBottom = cardEl ? cardEl.getBoundingClientRect().bottom : 170;
  const baseSpawnY = clamp(Math.max(cardBottom + r + (isLesson20 ? 25 : 16), H*0.22), 90, groundY - r*3.2);

  stones = opts.map((o,i)=>{
    const x = pad + slotW*(i+0.5);
    return {
      x, y: baseSpawnY + (isLesson20 ? (i * -38 + rnd(-15, -5)) : rnd(-10, 14)),
      vx: isLesson20 ? rnd(-12, 12) : rnd(-18, 18),
      vy: isLesson20 ? rnd(-10, 4) : rnd(0, 14),
      r,
      emoji: o.emoji,
      fa: o.fa,
      ar: o.ar,
      isCorrect: (i === correctIndex),
      rot: rnd(-0.28, 0.28),
      rotSpeed: isLesson20 ? rnd(-0.2, 0.2) : rnd(-0.3, 0.3),
      shape: makeShape(),
      alive: true,
      highlight: null,
      mark: null,
      markT: 0,
      touchedGround: false
    };
  });
}

/* =========================================================
   7) برخورد سنگ‌ها
   ========================================================= */
function collide(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  let d = Math.hypot(dx, dy);
  const minD = isLesson20 ? (a.r + b.r) * 1.25 : (a.r + b.r);
  if(d === 0) d = 0.001;
  if(d >= minD) return;

  const nx = dx/d, ny = dy/d;
  const overlap = (minD - d) * 0.5;
  a.x -= nx*overlap; a.y -= ny*overlap;
  b.x += nx*overlap; b.y += ny*overlap;

  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx*nx + rvy*ny;
  if(vn < 0){
    const imp = -(1 + 0.55) * vn * 0.5;
    a.vx -= imp*nx; a.vy -= imp*ny;
    b.vx += imp*nx; b.vy += imp*ny;
    if(Math.abs(vn) > 60){
      const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5;
      for(let i=0;i<4;i++){
        particles.push({
          x:mx, y:my, vx:rnd(-60,60), vy:rnd(-60,60),
          life:1, decay:rnd(1.6,2.6), size:rnd(2,5),
          color:'#9d8fc7'
        });
      }
    }
  }
}

/* =========================================================
   8) افکت‌ها
   ========================================================= */
function spawnDust(x, y, n){
  for(let i=0;i<n;i++){
    particles.push({
      x: x + rnd(-16,16),
      y: y - rnd(0,12),
      vx: rnd(-110,110),
      vy: rnd(-200,-40),
      life: 1,
      decay: rnd(1.3,2.4),
      size: rnd(4,13),
      color: '#8e7cc0'
    });
  }
}

function explode(x, y, emoji){
  const cols = ['#fff3b0','#ffd166','#ff9f1c','#ff5e00','#ffffff'];
  for(let i=0;i<36;i++){
    const a = Math.random()*Math.PI*2;
    const sp = rnd(90, 540);
    particles.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life: 1,
      decay: rnd(0.9, 1.9),
      size: rnd(3, 11),
      color: pick(cols),
      glow: true
    });
  }
  rings.push({ x, y, r: 8, maxR: rnd(120,180), life: 1, speed: rnd(380,540) });

  if(emoji){
    for(let i=0;i<5;i++){
      particles.push({
        x, y,
        vx: rnd(-170,170), vy: rnd(-300,-70),
        life: 1, decay: rnd(0.7,1.15),
        size: rnd(16,30),
        text: emoji,
        rot: rnd(-3,3), vr: rnd(-7,7)
      });
    }
  }
}

function addFloat(x, y, text, color){
  floats.push({ x, y, text, color, life: 1, vy: -78, vx: rnd(-18,18) });
}

function showToast(text, color){
  toastEl.textContent = text;
  toastEl.style.color = color;
  toastEl.style.textShadow = `0 0 22px ${color}, 0 6px 26px rgba(0,0,0,.95)`;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
}

/* =========================================================
   9) شلیک موشک
   ========================================================= */
function fireMissile(target){
  if(state !== 'playing') return;
  state = 'firing';

  const sx = W/2;
  const sy = groundY - 34;
  const ang = Math.atan2(target.y - sy, target.x - sx);

  missiles.push({
    x: sx, y: sy,
    vx: Math.cos(ang)*MISSILE_SPEED*0.45,
    vy: -MISSILE_SPEED,
    angle: -Math.PI/2,
    target,
    correct: target.isCorrect,
    life: 0,
    deflected: false,
    dir: Math.random() < 0.5 ? -1 : 1,
    trail: []
  });

  turretTarget = ang;
  shake = Math.max(shake, 9);
  SFX.fire();

  for(let i=0;i<16;i++){
    const a = rnd(-Math.PI, 0);
    particles.push({
      x: sx, y: sy,
      vx: Math.cos(a)*rnd(60,300),
      vy: Math.sin(a)*rnd(60,300),
      life: 1, decay: rnd(1.6,2.8),
      size: rnd(3,8),
      color: pick(['#ffd166','#ff9f1c','#ffffff']),
      glow: true
    });
  }
}

/* =========================================================
   10) برد، باخت، پایان وقت و پایان بازی
   ========================================================= */
function onWin(hitStone){
  state = 'win';
  coins += 10;
  updateCoins();

  const order = [hitStone, ...stones.filter(s => s !== hitStone)];
  order.forEach((s, i)=>{
    setTimeout(()=>{
      if(!s.alive) return;
      explode(s.x, s.y, s.emoji);
      s.alive = false;
      SFX.boom();
      shake = Math.max(shake, 26);
      flash = Math.max(flash, 0.9);
    }, i * 75);
  });

  addFloat(W/2, H*0.46, '+۱۰', '#7dff9b');
  showToast('🎯 عالی بود! +۱۰ سکه', '#7dff9b');
  SFX.coin();
  nextTimer = 2.1;
}

function onLose(wrongStone){
  if(state === 'lose' || state === 'win' || state === 'timeout' || state === 'over') return;
  state = 'lose';

  stones.forEach(s=>{
    if(s.isCorrect){ s.highlight = '#4dff88'; s.mark = '✓'; }
  });
  wrongStone.highlight = '#ff4d6d';
  wrongStone.mark = '✗';

  showToast('❌ اشتباه بود!', '#ff6b81');
  SFX.err();

  try {
    const wrongData = JSON.stringify({
      word: (typeof correctWord !== 'undefined' && correctWord) ? (correctWord.ar || '') : '',
      meaning: (typeof correctWord !== 'undefined' && correctWord) ? (correctWord.fa || '') : ''
    });
    if (typeof MistakeChannel !== 'undefined') {
      MistakeChannel.postMessage(wrongData);
    } else if (window.MistakeChannel) {
      window.MistakeChannel.postMessage(wrongData);
    }
  } catch(e) {}

  crashDelay = 0.42;
  nextTimer = 2.4;
}

function onAllLanded(){
  if(state !== 'playing') return;
  state = 'timeout';

  stones.forEach(s=>{
    if(s.isCorrect){ s.highlight = '#4dff88'; s.mark = '✓'; }
  });

  showToast('⏰ وقت تمام شد!', '#c8b6ff');
  SFX.err();

  try {
    const wrongData = JSON.stringify({
      word: (typeof correctWord !== 'undefined' && correctWord) ? (correctWord.ar || '') : '',
      meaning: (typeof correctWord !== 'undefined' && correctWord) ? (correctWord.fa || '') : ''
    });
    if (typeof MistakeChannel !== 'undefined') {
      MistakeChannel.postMessage(wrongData);
    } else if (window.MistakeChannel) {
      window.MistakeChannel.postMessage(wrongData);
    }
  } catch(e) {}

  nextTimer = 2.0;
}

function checkAllLanded(){
  if(state !== 'playing') return;
  const allDown = stones.every(s => !s.alive || s.touchedGround);
  if(allDown) onAllLanded();
}

function crashStones(){
  stones.forEach(s=>{
    if(!s.alive) return;
    s.vy = rnd(520, 860);
    s.vx = rnd(-230, 230);
    s.rotSpeed = rnd(-8, 8);
  });
  shake = Math.max(shake, 12);
}

/* ★ پایان بازی */
function endGame(){
  state = 'over';
  wordEl.textContent = '🎉';
  cardEl.querySelector('.hint').textContent = 'پایان بازی';
  showToast('🎉 بازی تمام شد!', '#ffd97a');
  SFX.finish();

  try {
    if (typeof CoinChannel !== 'undefined') {
        CoinChannel.postMessage(coins.toString());
    } else if (window.CoinChannel) {
        window.CoinChannel.postMessage(coins.toString());
    }
  } catch(e) {}
}

/* =========================================================
   11) آپدیت
   ========================================================= */
function update(dt){
  if(nextTimer > 0){
    nextTimer -= dt;
    if(nextTimer <= 0){
      /* ★ startRound خودش چک می‌کند که آیا کلمه‌ای باقی مانده یا نه */
      roundNum++;
      roundEl.textContent = toFa(roundNum);
      startRound();
      return;
    }
  }
  if(crashDelay > 0){
    crashDelay -= dt;
    if(crashDelay <= 0) crashStones();
  }

  /* ---- سنگ‌ها ---- */
  for(const s of stones){
    if(!s.alive) continue;

    const effGrav = isLesson20 ? GRAV * 0.48 : GRAV;
    const effTerm = isLesson20 ? TERM * 0.50 : TERM;

    s.vy += effGrav * dt;
    if(s.vy > effTerm) s.vy = effTerm;

    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.rotSpeed * dt;

    if(s.x - s.r < 0){ s.x = s.r; s.vx = Math.abs(s.vx)*0.82; }
    if(s.x + s.r > W){ s.x = W - s.r; s.vx = -Math.abs(s.vx)*0.82; }

    if(s.y + s.r > groundY){
      s.y = groundY - s.r;

      if(!s.touchedGround){
        s.touchedGround = true;
        checkAllLanded();
      }

      const impact = s.vy;
      if(impact > 45){
        s.vy = -impact * 0.30;
        s.vx *= 0.80;
        s.rotSpeed *= 0.7;
        spawnDust(s.x, groundY, Math.min(18, 5 + impact/70));
        shake = Math.max(shake, Math.min(15, impact/55));
        if(impact > 300) SFX.land();
      } else {
        s.vy = 0;
        s.vx *= 0.90;
        s.rotSpeed *= 0.88;
      }
    }
    if(s.markT < 1) s.markT += dt*2.4;
  }

  for(let i=0;i<stones.length;i++){
    for(let j=i+1;j<stones.length;j++){
      if(stones[i].alive && stones[j].alive) collide(stones[i], stones[j]);
    }
  }

  /* ---- موشک‌ها ---- */
  for(let i = missiles.length - 1; i >= 0; i--){
    const m = missiles[i];
    m.life += dt;

    if(!m.correct && !m.deflected && m.life > 0.30){
      m.deflected = true;
      const a = Math.atan2(m.vy, m.vx);
      const na = a + m.dir * 1.25;
      const sp = Math.hypot(m.vx, m.vy);
      m.vx = Math.cos(na) * sp;
      m.vy = Math.sin(na) * sp;
      for(let k=0;k<12;k++){
        particles.push({
          x: m.x, y: m.y,
          vx: rnd(-140,140), vy: rnd(-140,140),
          life: 1, decay: rnd(1.2,2.2), size: rnd(4,11),
          color: '#8a86a8'
        });
      }
      onLose(m.target);
    }

    const prevX = m.x;
    const prevY = m.y;

    if(!m.deflected){
      const tx = m.target.x, ty = m.target.y;
      const want = Math.atan2(ty - m.y, tx - m.x);
      const cur  = Math.atan2(m.vy, m.vx);
      let diff = want - cur;
      while(diff >  Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      const maxTurn = MISSILE_TURN * dt;
      const na = cur + clamp(diff, -maxTurn, maxTurn);
      const sp = Math.hypot(m.vx, m.vy);
      m.vx = Math.cos(na) * sp;
      m.vy = Math.sin(na) * sp;
    } else {
      m.vy += 340 * dt;
    }

    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.angle = Math.atan2(m.vy, m.vx);

    m.trail.push({
      x: m.x + rnd(-4,4), y: m.y + rnd(-4,4),
      r: rnd(3.5, 8), life: 1,
      c: pick(['#ffd166','#ff9f1c','#ff5e00','#ffffff'])
    });
    if(m.trail.length > 34) m.trail.shift();

    if(!m.deflected && m.correct && m.target.alive){
      const dx = m.x - prevX;
      const dy = m.y - prevY;
      const len2 = dx*dx + dy*dy;
      let t = 0;
      if(len2 > 0){
        t = ((m.target.x - prevX)*dx + (m.target.y - prevY)*dy) / len2;
        t = clamp(t, 0, 1);
      }
      const cx = prevX + dx*t;
      const cy = prevY + dy*t;
      const dist = Math.hypot(cx - m.target.x, cy - m.target.y);
      const hitR = m.target.r + 26;

      if(dist < hitR){
        missiles.splice(i,1);
        onWin(m.target);
        continue;
      }
    }

    if(m.x < -260 || m.x > W+260 || m.y < -400 || m.y > H+320){
      missiles.splice(i,1);
    }
  }

  for(const m of missiles){
    for(let i = m.trail.length-1; i >= 0; i--){
      const t = m.trail[i];
      t.life -= dt * 1.9;
      t.r *= 0.975;
      if(t.life <= 0) m.trail.splice(i,1);
    }
  }

  /* ---- ذرات ---- */
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += (p.glow ? 220 : 380) * dt;
    p.vx *= (1 - 1.1*dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if(p.text !== undefined){ p.rot += p.vr * dt; }
    if(p.life <= 0) particles.splice(i,1);
  }

  /* ---- حلقه‌های شوک ---- */
  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.r += r.speed * dt;
    r.speed *= (1 - 1.8*dt);
    r.life -= dt * 1.5;
    if(r.life <= 0) rings.splice(i,1);
  }

  /* ---- اعداد شناور ---- */
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.y += f.vy * dt;
    f.x += f.vx * dt;
    f.vy *= (1 - 1.4*dt);
    f.life -= dt * 0.85;
    if(f.life <= 0) floats.splice(i,1);
  }

  if(shake > 0) shake = Math.max(0, shake - dt * 58);
  if(flash > 0) flash = Math.max(0, flash - dt * 2.6);

  let diff = turretTarget - turretAngle;
  while(diff >  Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  turretAngle += diff * Math.min(1, dt * 13);
}

/* =========================================================
   12) رندر
   ========================================================= */
function rr(c, x, y, w, h, r){
  if(c.roundRect){ c.beginPath(); c.roundRect(x,y,w,h,r); return; }
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawBackground(){
  if(!skyGrad){
    skyGrad = ctx.createLinearGradient(0,0,0,H);
    skyGrad.addColorStop(0,   '#070716');
    skyGrad.addColorStop(0.42,'#141033');
    skyGrad.addColorStop(0.72,'#2a1740');
    skyGrad.addColorStop(1,   '#3f2049');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,H);

  const t = performance.now() * 0.001;
  for(const s of stars){
    const a = 0.3 + 0.7 * Math.abs(Math.sin(t * s.sp + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.c;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const mx = W*0.84, my = H*0.20, mr = Math.min(46, W*0.062);
  const mg = ctx.createRadialGradient(mx,my,mr*0.25, mx,my,mr*3.6);
  mg.addColorStop(0,'rgba(255,240,200,.34)');
  mg.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx,my,mr*3.6,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fff6d8';
  ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(226,210,168,.55)';
  ctx.beginPath(); ctx.arc(mx-mr*0.30, my-mr*0.26, mr*0.17, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.26, my+mr*0.16, mr*0.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.02, my-mr*0.44, mr*0.11, 0, Math.PI*2); ctx.fill();
}

function drawGround(){
  const gg = ctx.createLinearGradient(0, groundY-60, 0, groundY+12);
  gg.addColorStop(0,'rgba(160,90,255,0)');
  gg.addColorStop(1,'rgba(165,95,255,.30)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, groundY-60, W, 72);

  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0,   '#3a2350');
  g.addColorStop(0.32,'#241536');
  g.addColorStop(1,   '#0c0716');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.strokeStyle = 'rgba(192,142,255,.9)';
  ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(170,110,255,.95)';
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawTurret(){
  const bx = W/2, by = groundY + 2;
  ctx.save();
  ctx.translate(bx, by);

  ctx.fillStyle = '#2b2340';
  ctx.beginPath();
  ctx.moveTo(-36,0); ctx.lineTo(36,0);
  ctx.lineTo(25,-24); ctx.lineTo(-25,-24);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(155,120,255,.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.save();
  ctx.rotate(turretAngle + Math.PI/2);
  ctx.fillStyle = '#4a3d6e';
  rr(ctx, -8, -48, 16, 48, 7);
  ctx.fill();
  ctx.strokeStyle = 'rgba(175,140,255,.75)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#7c5cff';
  ctx.shadowColor = 'rgba(140,100,255,.9)';
  ctx.shadowBlur = 14;
  rr(ctx, -10, -54, 20, 11, 5);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.restore();
}

function drawStones(){
  for(const s of stones){
    if(!s.alive) continue;
    const r = s.r;

    if(s.highlight){
      const pulse = 0.55 + 0.45*Math.sin(performance.now()*0.008);
      ctx.save();
      ctx.globalAlpha = 0.55 * pulse;
      ctx.shadowColor = s.highlight;
      ctx.shadowBlur = 55;
      ctx.fillStyle = s.highlight;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r*1.12, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.beginPath();
    for(let i=0;i<s.shape.length;i++){
      const p = s.shape[i];
      const px = Math.cos(p.a)*p.r*r, py = Math.sin(p.a)*p.r*r;
      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath();

    const g = ctx.createRadialGradient(-r*0.35,-r*0.42,r*0.06, 0,0,r*1.18);
    g.addColorStop(0,   '#8f8fa8');
    g.addColorStop(0.42,'#50506a');
    g.addColorStop(1,   '#20202c');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(0,0,0,.65)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 9;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.strokeStyle = 'rgba(175,185,225,.35)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(20,20,30,.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r*0.42, -r*0.12);
    ctx.lineTo(-r*0.10, r*0.06);
    ctx.lineTo(-r*0.24, r*0.42);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.font = `${Math.round(r*0.94)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 8;
    ctx.fillText(s.emoji, 0, r*0.03);
    ctx.restore();

    if(s.mark){
      const t = Math.min(1, s.markT);
      const sc = 1 + (1-t)*0.8;
      ctx.save();
      ctx.globalAlpha = t;
      ctx.translate(s.x + r*0.62, s.y - r*0.62);
      ctx.scale(sc, sc);
      ctx.font = `900 ${Math.round(r*0.82)}px Tahoma, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(s.mark, 0, 0);
      ctx.fillStyle = s.mark === '✓' ? '#4dff88' : '#ff4d6d';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 20;
      ctx.fillText(s.mark, 0, 0);
      ctx.restore();
    }
  }
}

function drawMissiles(){
  for(const m of missiles){
    for(let i=0;i<m.trail.length;i++){
      const t = m.trail[i];
      const a = (i / m.trail.length) * 0.55 * t.life;
      if(a <= 0.01) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = t.c;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.angle + Math.PI/2);

    const f = 1 + Math.random()*0.55;
    const fg = ctx.createLinearGradient(0, 8, 0, 8 + 36*f);
    fg.addColorStop(0,   'rgba(255,245,170,1)');
    fg.addColorStop(0.35,'rgba(255,160,50,.92)');
    fg.addColorStop(1,   'rgba(255,60,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-7, 8);
    ctx.quadraticCurveTo(0, 12 + 36*f, 7, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#dfe3f0';
    ctx.beginPath();
    ctx.moveTo(-7, 10);
    ctx.lineTo(-7,-14);
    ctx.lineTo(0, -26);
    ctx.lineTo(7, -14);
    ctx.lineTo(7, 10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff4d5e';
    ctx.beginPath();
    ctx.moveTo(-7,-14);
    ctx.lineTo(0,-26);
    ctx.lineTo(7,-14);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath(); ctx.moveTo(-7,2);  ctx.lineTo(-15,13); ctx.lineTo(-7,10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 7,2);  ctx.lineTo( 15,13); ctx.lineTo( 7,10); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#4fd1ff';
    ctx.shadowColor = '#4fd1ff';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0,-6,3.6,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = Math.max(0, Math.min(1, p.life));
    ctx.globalAlpha = a;
    if(p.text !== undefined){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.font = `${Math.round(p.size)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    } else {
      if(p.glow){
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 18;
      }
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.35 + 0.65*a), 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;
}

function drawRings(){
  for(const r of rings){
    const a = Math.max(0, r.life);
    ctx.globalAlpha = a * 0.75;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3 + 7*a;
    ctx.shadowColor = '#ff9f1c';
    ctx.shadowBlur = 26;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  for(const f of floats){
    const a = Math.max(0, Math.min(1, f.life));
    const sc = 1 + (1 - f.life) * 0.35;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(f.x, f.y);
    ctx.scale(sc, sc);
    ctx.font = '900 42px Vazirmatn, Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 26;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  ctx.save();
  if(shake > 0.3){
    ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
  }

  drawBackground();
  drawGround();
  drawTurret();
  drawStones();
  drawMissiles();
  drawParticles();
  drawRings();
  drawFloats();

  ctx.restore();

  if(flash > 0.01){
    ctx.fillStyle = `rgba(255,242,205,${flash*0.55})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* =========================================================
   13) حلقه بازی
   ========================================================= */
let lastTime = performance.now();
function loop(now){
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

/* =========================================================
   14) تعامل
   ========================================================= */
function hitStone(mx, my){
  for(let i = stones.length - 1; i >= 0; i--){
    const s = stones[i];
    if(!s.alive) continue;
    if(Math.hypot(mx - s.x, my - s.y) <= s.r * 1.02) return s;
  }
  return null;
}

function pointerPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', (e)=>{
  A();
  if(state !== 'playing') return;
  const p = pointerPos(e);
  const s = hitStone(p.x, p.y);
  if(s) fireMissile(s);
}, { passive: true });

canvas.addEventListener('pointermove', (e)=>{
  const p = pointerPos(e);
  turretTarget = Math.atan2(p.y - (groundY - 34), p.x - W/2);
  canvas.style.cursor = (state === 'playing' && hitStone(p.x, p.y)) ? 'pointer' : 'default';
}, { passive: true });

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive:false });

document.addEventListener('visibilitychange', ()=>{
  lastTime = performance.now();
});

/* =========================================================
   15) شروع
   ========================================================= */
function updateCoins(){
  coinsEl.textContent = toFa(coins);
}

resize();
roundEl.textContent = toFa(roundNum);
updateCoins();
startRound();
requestAnimationFrame(loop);

})();
</script>
